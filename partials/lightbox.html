<!-- ============================================================
     LIGHTBOX
     ============================================================ -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de foto">
  <div class="lightbox-bg" aria-hidden="true"></div>

  <div class="lightbox-content">
    <div class="lightbox-img-wrapper">
      <img class="lightbox-img" src="" alt="" />
    </div>
    <div class="lightbox-caption">
      <h3 class="lightbox-title"></h3>
      <p class="lightbox-category"></p>
    </div>
  </div>

  <button class="lightbox-close" aria-label="Fechar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <button class="lightbox-nav lightbox-prev" aria-label="Foto anterior">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <button class="lightbox-nav lightbox-next" aria-label="Próxima foto">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>

  <div class="lightbox-counter" aria-live="polite"></div>
</div>
